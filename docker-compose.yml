# Postgres local para desarrollo (coincide con el DATABASE_URL por defecto de config.go).
# Uso:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: tuanispay-db
    environment:
      POSTGRES_USER: tuanispay
      POSTGRES_PASSWORD: tuanispay_dev
      POSTGRES_DB: tuanispay
    ports:
      - '5433:5432'
    volumes:
      - tuanispay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tuanispay -d tuanispay']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tuanispay_pgdata:
